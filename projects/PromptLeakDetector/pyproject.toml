[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptleakdetector"
version = "0.1.0"
description = "Runtime detection of system prompt and context leakage in LLM applications"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7"
]

[tool.setuptools.packages.find]
where = ["src"]
